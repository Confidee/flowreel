# SPDX-License-Identifier: Apache-2.0
#
# Publishes @confidee/flowreel to npm when a tag v<version> is pushed.
#
# Three jobs, so the OIDC token can be minted only where nothing but the
# publish runs:
# - `build` (no id-token): checks that the tagged commit is on main and the
#   tag matches every version, installs the dev dependencies without their
#   lifecycle scripts, runs the checks, builds, packs the tarball and
#   uploads it with its SHA-256.
# - `publish` (id-token: write, the `npm` environment with required
#   reviewers): no checkout and no dependency install. It downloads the
#   tarball, checks its SHA-256 against the build job's, and publishes
#   that file.
# - `github-release` (contents: write, after the publish): creates the
#   GitHub Release for the tag, with the notes from CHANGELOG.md
#   (scripts/release-notes.mjs). An existing release is left unchanged.
#
# npm trusted publishing (OIDC): no NPM_TOKEN secret exists or is used. npm
# accepts the publish only when its trusted-publisher settings for the
# package name this repository, this workflow file (release.yml) and, when
# set there, the `npm` environment below. Provenance is generated and
# published with the package. See RELEASING.md.
#
# Actions are pinned to full commit SHAs (the comment names the release).

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the release
    # Never from a fork.
    if: github.repository == 'Confidee/flowreel'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history and branches, for the on-main check below.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a release job (cache poisoning).
          package-manager-cache: false

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a merge commit on main."
            exit 1
          fi

      - name: The tag matches every version
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

      # The runtime's dev dependencies need no install scripts.
      - name: Install (no lifecycle scripts)
        working-directory: runtime
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: runtime
        run: npm run typecheck
      - name: Test (leak tripwire, unit tests)
        working-directory: runtime
        env:
          # The project patterns for the leak tripwire (see
          # scripts/check-leaks.mjs); empty when the secret is not set.
          FLOWREEL_LEAK_PATTERNS: ${{ secrets.FLOWREEL_LEAK_PATTERNS }}
        run: npm run test:coverage
      - name: Build
        working-directory: runtime
        run: npm run build
      - name: Every entry point loads
        working-directory: runtime
        run: npm run smoke:exports

      - name: Pack
        id: pack
        working-directory: runtime
        run: |
          tarball="$(npm pack --ignore-scripts --silent)"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Release tarball \`$tarball\`, SHA-256 \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: runtime/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    if: github.repository == 'Confidee/flowreel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers on this environment (repository settings) make a
    # second person approve every publish, after the build job passed. See
    # RELEASING.md.
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball

      - name: The tarball is the one the build job packed
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check --strict

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14). Node 24's
      # bundled npm is used when it is new enough; otherwise this pinned npm
      # is installed, without lifecycle scripts.
      - name: npm with trusted publishing support
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install --global --ignore-scripts npm@11.21.1
          fi
          npm --version

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public

  github-release:
    name: Create the GitHub Release
    # Only after npm accepted the publish, so a GitHub Release always names
    # a version that exists on npm.
    needs: publish
    if: github.repository == 'Confidee/flowreel'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that can write to the repository, and only to create the
    # release; it never sees the npm OIDC token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # An existing release (made by hand, or by a re-run) is left as it is.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists; left unchanged."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "flowreel ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "GitHub Release [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG) created." >> "$GITHUB_STEP_SUMMARY"
